<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SpareHouse</title>
    <link rel="stylesheet" href="../assets/css/sparehouse_styles.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

<header>
    <div class="container">
        <div class="logo">
            <img src="../assets/images/login-logo.png (2).webp" alt="SpareHouse Logo">
            <h1>Spare<span>House</span></h1>
        </div>
    </div>
</header>

<section class="login-section">
    <div class="container">
        <h2>Login to Your Account</h2>
        <form id="loginForm" data-action="login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <a href="register.html" class="btn signup-btn">Sign Up</a>
        </form>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2025 SpareHouse. All Rights Reserved.</p>
    </div>
</footer>

<script src="../assets/js/login.js"></script>
</body>
</html>
