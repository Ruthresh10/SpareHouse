<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SpareHouse</title>
    <link rel="stylesheet" href="../assets/css/sparehouse_styles.css">
</head>
<body>

<header>
    <!-- Include header component here -->
</header>

<section class="contact-section">
    <div class="container">
        <h2>Contact Us</h2>
        <p>If you have any questions or inquiries, feel free to reach out to us using the form below.</p>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </div>
</section>

<footer>
    <!-- Include footer component here -->
</footer>

<script src="../assets/js/sparehouse_scripts.js"></script>
</body>
</html>
