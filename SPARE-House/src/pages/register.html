<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SpareHouse</title>
    <link rel="stylesheet" href="../assets/css/sparehouse_styles.css">
    <link rel="stylesheet" href="../assets/css/register.css">
</head>
<body>

<header>
    <div class="container">
        <div class="logo">
            <img src="../assets/images/login-logo.png (2).webp" alt="SpareHouse Logo">
            <h1>Spare<span>House</span></h1>
        </div>
    </div>
</header>

<section class="register-section">
    <div class="container">
        <h2>Create Your Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn">Sign Up</button>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2025 SpareHouse. All Rights Reserved.</p>
    </div>
</footer>

<script src="../assets/js/register.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username && password) {
            const users = JSON.parse(localStorage.getItem('users')) || {};
            if (users[username]) {
                alert('Username already exists. Please choose a different username.');
            } else {
                users[username] = password;
                localStorage.setItem('users', JSON.stringify(users));
                alert('Account created successfully! You can now log in.');
                window.location.href = 'login.html'; // Redirect to login page
            }
        } else {
            alert('Please fill in all fields.');
        }
    });
</script>
</body>
</html>
